<div class="container">
    <div>
        <h1 class="text-center my-3">Novo curso</h1>
        <form (submit)="Create()" #form="ngForm">
            <div class="row mb-3">
                <label for="nome" class="col-sm-2 col-form-label">Nome:</label>
                <div class="col-sm-8">
                    <input type="text" class="form-control" id="nome" name="nome" minlength="3" maxlength="150" required [(ngModel)]="this.curso.nome">
                </div>
            </div>
            <div class="row mb-3">
                <label for="cargaHoraria" class="col-sm-2 col-form-label">Carga horária:</label>
                <div class="col-sm-1">
                    <input type="number" class="form-control" id="cargaHoraria" name="cargaHoraria" min="1" required [(ngModel)]="this.curso.cargaHoraria">
                </div>
            </div>
            <div class="row mb-3">
                <label for="valor" class="col-sm-2 col-form-label">Valor:</label>
                <div class="col-sm-2">
                    <input type="number" step="0.01" class="form-control" id="valor" name="valor" min="0" required [(ngModel)]="this.curso.valor">
                </div>
            </div>
            <div class="row mb-3">
                <label for="dataInicio" class="col-sm-2 col-form-label">Data de início:</label>
                <div class="col-sm-2">
                    <input type="date" class="form-control" id="dataInicio" name="dataInicio" min="{{ dataMinima }}" required [(ngModel)]="this.curso.dataInicio">
                </div>
            </div>
            <div class="row mb-3">
                <label for="Online" class="col-sm-2 col-form-label">Online:</label>
                <div class="col-sm-4">
                    <input type="checkbox" class="form-check-input" id="online" name="online" [(ngModel)]="this.curso.online">
                </div>
            </div>
            <div class="row mb-3">
                <label for="Ativo" class="col-sm-2 col-form-label">Ativo:</label>
                <div class="col-sm-4">
                    <input type="checkbox" class="form-check-input" id="ativo" name="ativo" [(ngModel)]="this.curso.ativo">
                </div>
            </div>
            <div class="text-center">                        
                <button type="button" class="btn btn-secondary" (click)="RedirectToListar();">Voltar</button>
                <button type="reset" class="btn btn-secondary">Limpar</button>
                <button class="btn btn-primary" [disabled]="form.invalid">Salvar</button>
            </div>            
        </form>
    </div>
</div>
